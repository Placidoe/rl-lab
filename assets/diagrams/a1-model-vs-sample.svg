<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Planning versus sampling in GridWorld</title>
  <desc id="desc">A comparison of a planner that inspects all possible actions and a Q-learning agent that improves from one sampled trajectory at a time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091629"/><stop offset="1" stop-color="#172541"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9ec2ed"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6fe0a6"/></marker>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="60" y="64" fill="#f2f7ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">GridWorld：规划与从样本学习不是“快慢版本”，而是信息条件不同</text>
  <line x1="600" y1="115" x2="600" y2="560" stroke="#466182" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="290" y="125" text-anchor="middle" fill="#7fc4ff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Value iteration：模型已知</text>
  <text x="890" y="125" text-anchor="middle" fill="#7ce7ae" font-family="Arial, sans-serif" font-size="23" font-weight="700">Q-learning：模型未知</text>
  <text x="290" y="155" text-anchor="middle" fill="#b7c9e1" font-family="Arial, sans-serif" font-size="16">每个 state 同时检查全部动作和转移</text>
  <text x="890" y="155" text-anchor="middle" fill="#b7c9e1" font-family="Arial, sans-serif" font-size="16">一条交互轨迹只更新它经过的 (state, action)</text>
  <g fill="#172c49" stroke="#6784ad" stroke-width="2">
    <rect x="115" y="220" width="95" height="70" rx="10"/><rect x="245" y="220" width="95" height="70" rx="10"/><rect x="375" y="220" width="95" height="70" rx="10"/>
    <rect x="245" y="365" width="95" height="70" rx="10"/>
  </g>
  <circle cx="292" cy="255" r="16" fill="#4daaf5"/><text x="292" y="261" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">s</text>
  <text x="163" y="263" text-anchor="middle" fill="#dcecff" font-family="Arial, sans-serif" font-size="17">left</text><text x="423" y="263" text-anchor="middle" fill="#dcecff" font-family="Arial, sans-serif" font-size="17">right</text><text x="292" y="408" text-anchor="middle" fill="#dcecff" font-family="Arial, sans-serif" font-size="17">down</text>
  <path d="M245 255 H218" fill="none" stroke="#9ec2ed" stroke-width="3" marker-end="url(#a)"/><path d="M340 255 H367" fill="none" stroke="#9ec2ed" stroke-width="3" marker-end="url(#a)"/><path d="M292 290 V352" fill="none" stroke="#9ec2ed" stroke-width="3" marker-end="url(#a)"/>
  <rect x="100" y="485" width="380" height="48" rx="12" fill="#203c63"/><text x="290" y="516" text-anchor="middle" fill="#e8f4ff" font-family="Arial, sans-serif" font-size="17">一次 sweep：用全部分支更新 V(s)</text>
  <g fill="#173b3a" stroke="#4a9c86" stroke-width="2">
    <rect x="712" y="220" width="95" height="70" rx="10"/><rect x="842" y="220" width="95" height="70" rx="10"/><rect x="972" y="220" width="95" height="70" rx="10"/>
    <rect x="972" y="365" width="95" height="70" rx="10"/>
  </g>
  <circle cx="758" cy="255" r="16" fill="#43c88c"/><text x="758" y="261" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">s₀</text>
  <text x="889" y="261" text-anchor="middle" fill="#dfffee" font-family="Arial, sans-serif" font-size="17">s₁</text><text x="1019" y="261" text-anchor="middle" fill="#dfffee" font-family="Arial, sans-serif" font-size="17">s₂</text><text x="1019" y="408" text-anchor="middle" fill="#dfffee" font-family="Arial, sans-serif" font-size="17">goal</text>
  <path d="M807 255 H833" fill="none" stroke="#6fe0a6" stroke-width="4" marker-end="url(#g)"/><path d="M937 255 H963" fill="none" stroke="#6fe0a6" stroke-width="4" marker-end="url(#g)"/><path d="M1019 290 V352" fill="none" stroke="#6fe0a6" stroke-width="4" marker-end="url(#g)"/>
  <text x="758" y="197" text-anchor="middle" fill="#b9f5d5" font-family="Arial, sans-serif" font-size="15">采到 a₀</text><text x="889" y="197" text-anchor="middle" fill="#b9f5d5" font-family="Arial, sans-serif" font-size="15">采到 a₁</text><text x="1019" y="463" text-anchor="middle" fill="#b9f5d5" font-family="Arial, sans-serif" font-size="15">回报传播</text>
  <rect x="700" y="485" width="380" height="48" rx="12" fill="#1d5148"/><text x="890" y="516" text-anchor="middle" fill="#e4fff3" font-family="Arial, sans-serif" font-size="17">每一步：仅更新 Q(sₜ, aₜ)</text>
</svg>
