<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700" role="img" aria-labelledby="title desc">
  <title id="title">Reinforcement learning capability map</title>
  <desc id="desc">A map from MDP foundations through value learning, policy optimization, offline learning, LLM agents, and systems evaluation.</desc>
  <style>
    .bg{fill:#09111f}.box{fill:#132238;stroke:#3a628f;stroke-width:2}.hot{fill:#123d35;stroke:#2dd4bf}.warn{fill:#3a2c13;stroke:#fbbf24}.line{stroke:#7dd3fc;stroke-width:3;fill:none}.t{fill:#f1f5f9;font-family:ui-sans-serif,system-ui,sans-serif}.h{font-size:24px;font-weight:700}.s{fill:#c5d4e8;font-size:16px}.m{fill:#dbeafe;font:15px ui-monospace,SFMono-Regular,monospace}
  </style>
  <rect class="bg" width="1320" height="700" rx="24"/><text class="t h" x="46" y="52">RL 学习与实验能力地图</text><text class="t s" x="46" y="80">所有分支都要回到：reward 定义 → rollout → update → 独立 evaluation</text>
  <g transform="translate(45 120)"><rect class="box" width="220" height="190" rx="16"/><text class="t h" x="18" y="35">MDP foundation</text><text class="t m" x="18" y="70">S, A, P, r, γ</text><text class="t s" x="18" y="105">return / Bellman</text><text class="t s" x="18" y="132">exploration</text><text class="t s" x="18" y="159">evaluation seeds</text></g>
  <path class="line" d="M270 215H325l-14-10m14 10l-14 10"/><g transform="translate(330 105)"><rect class="box" width="240" height="220" rx="16"/><text class="t h" x="18" y="36">Value learning</text><text class="t m" x="18" y="74">TD target</text><text class="t s" x="18" y="108">Q-learning · DQN</text><text class="t s" x="18" y="135">replay · target net</text><text class="t s" x="18" y="162">Double · Dueling · PER</text><text class="t s" x="18" y="192">discrete action</text></g>
  <path class="line" d="M575 215H630l-14-10m14 10l-14 10"/><g transform="translate(635 105)"><rect class="hot" width="245" height="220" rx="16"/><text class="t h" x="18" y="36">Policy optimization</text><text class="t m" x="18" y="74">∇ log π · Â</text><text class="t s" x="18" y="108">REINFORCE · A2C</text><text class="t s" x="18" y="135">GAE · PPO clip</text><text class="t s" x="18" y="162">SAC · TD3</text><text class="t s" x="18" y="192">continuous action</text></g>
  <path class="line" d="M885 215H940l-14-10m14 10l-14 10"/><g transform="translate(945 105)"><rect class="warn" width="330" height="220" rx="16"/><text class="t h" x="18" y="36">Data / preference / agents</text><text class="t m" x="18" y="74">D(s,a) · verifier · reward</text><text class="t s" x="18" y="108">BC · IQL · CQL · DAgger</text><text class="t s" x="18" y="135">preference reward model</text><text class="t s" x="18" y="162">LLM rollout · GRPO/PPO</text><text class="t s" x="18" y="192">OOD / reward hacking</text></g>
  <g transform="translate(100 420)"><rect class="box" width="340" height="190" rx="16"/><text class="t h" x="20" y="38">实验方法</text><text class="t s" x="20" y="76">baseline + one-variable ablation</text><text class="t s" x="20" y="106">multiple seeds + held-out evaluation</text><text class="t s" x="20" y="136">failure taxonomy + confidence intervals</text><text class="t s" x="20" y="166">no train/eval contamination</text></g>
  <g transform="translate(490 420)"><rect class="box" width="340" height="190" rx="16"/><text class="t h" x="20" y="38">RL systems</text><text class="t s" x="20" y="76">vector env · sync / async rollout</text><text class="t s" x="20" y="106">replay I/O · batching · mixed precision</text><text class="t s" x="20" y="136">DDP · profiling · checkpointing</text><text class="t s" x="20" y="166">CPU / GPU bottleneck separation</text></g>
  <g transform="translate(880 420)"><rect class="hot" width="340" height="190" rx="16"/><text class="t h" x="20" y="38">Kaggle T4×2 labs</text><text class="t s" x="20" y="76">Classic control → MiniGrid → vision</text><text class="t s" x="20" y="106">offline RL → toy LLM Agent RL</text><text class="t s" x="20" y="136">small-model / LoRA only</text><text class="t s" x="20" y="166">not large-scale production RLHF</text></g>
  <path class="line" d="M660 330V395l-12-14m12 14l12-14"/>
</svg>
